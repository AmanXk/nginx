services:
  api1:
    build: .
    environment:
      SERVER_NAME: SERVER-1

  api2:
    build: .
    environment:
      SERVER_NAME: SERVER-2

  api3:
    build: .
    environment:
      SERVER_NAME: SERVER-3

  redis:
    image: redis:7-alpine

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
      - redis